<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro Scolastico | Ale Cloud</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDnDGyBXquFKzoH7m2pXMta3Ywbc6af_lw",
    authDomain: "registro-b3d67.firebaseapp.com",
    projectId: "registro-b3d67",
    storageBucket: "registro-b3d67.firebasestorage.app",
    messagingSenderId: "212712192143",
    appId: "1:212712192143:web:56c78b607e8745e14f58fa",
    measurementId: "G-G4KTEF2BYZ"
  };

  const app = initializeApp(firebaseConfig);
  const dbCloud = getFirestore(app);

  // Hash SHA-256 corretto per "passwordale"
  const SECRET_PASSWORD_HASH = "b7a3560737f2a1b1897d287042afb7931f6e2ec9079dd21ff3c43425cb0aeec2";
  const LAB_SUBJECTS = ["TPS", "Telecomunicazioni", "Sistemi", "Informatica"];

  let db = {
      currentYear: "2025/2026",
      years: {
          "2025/2026": { trimestre: {}, pentamestre: {} }
      }
  };

  let currentPeriod = "trimestre";
  let pendingAction = null;

  window.loadDataFromFirebase = async function() {
      try {
          const docRef = doc(dbCloud, "registro_data", "dati_voti");
          const docSnap = await getDoc(docRef);
          if (docSnap.exists()) {
              db = docSnap.data();
          }
      } catch (e) {
          console.error("Errore caricamento Firebase:", e);
      }
      window.render();
  };

  window.saveDataToFirebase = async function() {
      try {
          const docRef = doc(dbCloud, "registro_data", "dati_voti");
          await setDoc(docRef, db);
      } catch (e) {
          console.error("Errore salvataggio Firebase:", e);
      }
  };

  window.hashPassword = async function(string) {
      const encoder = new TextEncoder();
      const data = encoder.encode(string);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  };

  // Gestione modale password sicura e nascosta
  window.requestPassword = function(actionCallback) {
      pendingAction = actionCallback;
      document.getElementById("passwordModal").style.display = "flex";
      document.getElementById("modalPasswordInput").value = "";
      document.getElementById("modalPasswordInput").focus();
  };

  window.closeModal = function() {
      document.getElementById("passwordModal").style.display = "none";
      pendingAction = null;
  };

  window.confirmPassword = async function() {
      const pwd = document.getElementById("modalPasswordInput").value;
      const hashedInput = await window.hashPassword(pwd);
      if (hashedInput !== SECRET_PASSWORD_HASH) {
          alert("❌ Password errata!");
          return;
      }
      document.getElementById("passwordModal").style.display = "none";
      if (pendingAction) {
          const cb = pendingAction;
          pendingAction = null;
          cb();
      }
  };

  window.parseGradeString = function(str) {
      str = str.trim();
      let base = parseFloat(str);
      if (isNaN(base)) return NaN;
      if (str.endsWith("+")) base += 0.25;
      else if (str.endsWith("-")) base -= 0.25;
      return base;
  };

  window.changePeriod = function() {
      currentPeriod = document.getElementById("periodSelect").value;
      window.render();
  };

  window.switchSchoolYear = function() {
      db.currentYear = document.getElementById("schoolYearSelect").value;
      window.saveDataToFirebase();
      window.render();
  };

  window.verifyAndAdd = function() {
      window.requestPassword(async () => {
          const subject = document.getElementById("subjectSelect").value;
          const rawInput = document.getElementById("gradeInput").value.trim();
          const weight = parseFloat(document.getElementById("weightSelect").value);
          const isLab = document.getElementById("isLabInput").checked;

          if (!subject) {
              alert("Seleziona una materia!");
              return;
          }
          if (!rawInput) {
              alert("Inserisci almeno un voto!");
              return;
          }

          const parts = rawInput.split(",");
          for (let part of parts) {
              const val = window.parseGradeString(part);
              if (isNaN(val) || val < 1 || val > 10) {
                  alert(`"${part}" non è valido! Usa numeri da 1 a 10 (es. 7.5 o 8+).`);
                  return;
              }

              if (!db.years[db.currentYear]) {
                  db.years[db.currentYear] = { trimestre: {}, pentamestre: {} };
              }
              if (!db.years[db.currentYear][currentPeriod]) {
                  db.years[db.currentYear][currentPeriod] = {};
              }

              const yData = db.years[db.currentYear][currentPeriod];
              if (!yData[subject]) yData[subject] = [];

              yData[subject].push({
                  value: val,
                  weight: weight,
                  isLab: LAB_SUBJECTS.includes(subject) && isLab
              });
          }

          await window.saveDataToFirebase();
          document.getElementById("gradeInput").value = "";
          document.getElementById("isLabInput").checked = false;
          window.render();
      });
  };

  window.calculateWeightedAverage = function(grades) {
      const valid = grades.filter(g => g.weight > 0);
      if (valid.length === 0) return { avg: 0, count: 0 };
      let sumProd = 0, sumWeight = 0;
      valid.forEach(g => {
          sumProd += g.value * g.weight;
          sumWeight += g.weight;
      });
      return { avg: sumProd / sumWeight, count: valid.length };
  };

  window.getGradeClass = function(val, weight) {
      if (weight === 0) return "grade-blue";
      if (val >= 7) return "grade-dark-green";
      if (val >= 6) return "grade-light-green";
      if (val >= 5.5) return "grade-orange";
      return "grade-red";
  };

  window.deleteGrade = function(subject, index) {
      window.requestPassword(async () => {
          const yData = db.years[db.currentYear][currentPeriod];
          yData[subject].splice(index, 1);
          if (yData[subject].length === 0) delete yData[subject];
          await window.saveDataToFirebase();
          window.render();
      });
  };

  window.verifyAndReset = function() {
      window.requestPassword(async () => {
          if (confirm(`Cancellare tutti i voti del ${currentPeriod} per l'anno ${db.currentYear}?`)) {
              db.years[db.currentYear][currentPeriod] = {};
              await window.saveDataToFirebase();
              window.render();
          }
      });
  };

  window.startNewYear = function() {
      window.requestPassword(async () => {
          const parts = db.currentYear.split("/");
          const nextYear = `${parseInt(parts[0])+1}/${parseInt(parts[1])+1}`;
          
          if (db.years[nextYear]) {
              db.currentYear = nextYear;
          } else {
              if (confirm(`Vuoi archiviare l'anno corrente e iniziare il nuovo anno scolastico ${nextYear}?`)) {
                  db.years[nextYear] = { trimestre: {}, pentamestre: {} };
                  db.currentYear = nextYear;
                  await window.saveDataToFirebase();
              } else return;
          }
          window.render();
      });
  };

  window.render = function() {
      const yearSel = document.getElementById("schoolYearSelect");
      if (!yearSel) return;
      yearSel.innerHTML = "";
      Object.keys(db.years).forEach(y => {
          const opt = document.createElement("option");
          opt.value = y;
          opt.textContent = "Anno " + y;
          if (y === db.currentYear) opt.selected = true;
          yearSel.appendChild(opt);
      });

      document.getElementById("currentYearDisplay").textContent = "Anno Scolastico: " + db.currentYear;
      document.getElementById("averageTitle").textContent = `Media Generale (${currentPeriod.toUpperCase()})`;

      const list = document.getElementById("subjectsList");
      const general = document.getElementById("generalAverage");
      const total = document.getElementById("totalGrades");

      list.innerHTML = "";
      const yData = db.years[db.currentYear] ? db.years[db.currentYear][currentPeriod] || {} : {};
      const subKeys = Object.keys(yData);

      if (subKeys.length === 0) {
          list.innerHTML = '<div class="empty-box">Nessun voto inserito in questo periodo.</div>';
          general.textContent = "--";
          total.textContent = "0 voti registrati";
          return;
      }

      let allGrades = [];
      subKeys.forEach(sub => {
          const grades = yData[sub];
          allGrades = allGrades.concat(grades);
          const { avg, count } = window.calculateWeightedAverage(grades);

          const card = document.createElement("div");
          card.className = "subject-card";

          const info = document.createElement("div");
          info.className = "subject-info";
          info.innerHTML = `<span class="subject-title">📖 ${sub}</span><span class="subject-avg">${count > 0 ? avg.toFixed(2) : '--'}</span>`;
          card.appendChild(info);

          const container = document.createElement("div");
          container.className = "grades-container";

          grades.forEach((g, idx) => {
              const tag = document.createElement("div");
              tag.className = `grade-tag ${window.getGradeClass(g.value, g.weight)}`;
              
              let label = g.value.toString();
              if (g.weight === 0) label += " (0%)";
              else if (g.weight === 0.5) label += " (50%)";
              if (g.isLab) label += ' <span class="lab-label">Lab</span>';

              tag.innerHTML = `${label} <button class="delete-badge" onclick="deleteGrade('${sub.replace(/'/g, "\\'")}', ${idx})">&times;</button>`;
              container.appendChild(tag);
          });

          card.appendChild(container);
          list.appendChild(card);
      });

      const genRes = window.calculateWeightedAverage(allGrades);
      general.textContent = genRes.count > 0 ? genRes.avg.toFixed(2) : "--";
      total.textContent = allGrades.length + " voti registrati in totale";
  };

  window.addEventListener("DOMContentLoaded", () => {
      window.loadDataFromFirebase();
      
      document.getElementById("subjectSelect").addEventListener("change", function() {
          const sub = this.value;
          const labBox = document.getElementById("labContainer");
          if (LAB_SUBJECTS.includes(sub)) {
              labBox.style.display = "flex";
          } else {
              labBox.style.display = "none";
              document.getElementById("isLabInput").checked = false;
          }
      });
  });
</script>

<style>

    --bg-base: #07090e;
    --bg-gradient: radial-gradient(circle at top right, #1e1b4b 0%, #07090e 60%);

}

}

.select-wrapper {

}

select {
    width: 100%;
    padding: 12px 16px;

}

.select-wrapper::after {

.hero-card {

}

.big-number {

}

.total-grades {
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 500;
    margin: 0;
}

.panel {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(16px);
    padding: 24px;
    border-radius: 24px;

.panel-title {
    font-size: 16px;

    display: flex;

}

.form-group {
    margin-bottom: 12px;
}

input[type="text"] {

    padding: 14px 16px;
    border-radius: 14px;

button {

    border: none;
    font-size: 15px;
    font-weight: 700;

    align-items: center;

.btn-primary {

.btn-primary:hover {

}

.btn-warning {

    border: 1px solid rgba(245, 158, 11, 0.3);
}

    background: var(--warning);

}

.btn-danger {

    color: #fda4af;
    border: 1px solid rgba(244, 63, 94, 0.25);
}

.btn-danger:hover {

}

.hint {

}

.subject-card {

.subject-info {

}

.subject-title {

}

.subject-avg {

}

.grades-container {

}

}

.grade-dark-green { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.35); color: #34d399; }

.grade-orange { background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.3); color: #fbbf24; }
.grade-red { background: rgba(244, 63, 94, 0.12); border: 1px solid rgba(244, 63, 94, 0.3); color: #fb7185; }

.modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;

    backdrop-filter: blur(8px);

    align-items: center;
    justify-content: center;

}

.modal-box {
    background: #121826;
    border: 1px solid rgba(99, 102, 241, 0.3);
    padding: 24px;

    max-width: 380px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
}

.modal-box h3 {
    margin: 0 0 8px 0;
    font-size: 18px;
    color: var(--text-main);
}

.modal-box p {

    font-size: 13px;
    margin: 0 0 16px 0;
}

.modal-box input[type="password"] {
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;

    color: var(--text-main);
    font-size: 16px;
    outline: none;
    margin-bottom: 16px;
}

.modal-box input[type="password"]:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
}

.modal-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.btn-secondary {
    background: rgba(255,255,255,0.05);
    color: var(--text-muted);
    border: 1px solid var(--card-border);
}

    color: var(--text-main);
}

@media(max-width: 480px) {
    body { padding: 12px 8px; }
    .big-number { font-size: 46px; }
    .form-row { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<!-- Modale Password Nascosta -->
<div id="passwordModal" class="modal-overlay">
    <div class="modal-box">
        <h3>🔐 Autenticazione</h3>
        <p>Inserisci la password segreta per procedere:</p>
        <input type="password" id="modalPasswordInput" placeholder="Password..." onkeydown="if(event.key==='Enter') confirmPassword()">
        <div class="modal-buttons">
            <button class="btn-secondary" onclick="closeModal()">Annulla</button>
            <button class="btn-primary" style="margin-top:0;" onclick="confirmPassword()">Conferma</button>
        </div>
    </div>
</div>

<div class="container">

    <header>
        <div class="logo-badge">☁️ Firebase Cloud Connesso</div>
        <h1>Registro Scolastico</h1>
        <p class="subtitle" id="currentYearDisplay">Anno 2025/2026</p>
    </header>

    <div class="top-nav">
        <div class="select-wrapper">
            <select id="periodSelect" onchange="window.changePeriod()">
                <option value="trimestre">📅 Trimestre</option>
                <option value="pentamestre">📅 Pentamestre</option>
            </select>
        </div>
        <div class="select-wrapper">
            <select id="schoolYearSelect" onchange="window.switchSchoolYear()"></select>
        </div>
    </div>

    <div class="hero-card">
        <div class="hero-title" id="averageTitle">Media Generale Trimestre</div>
        <div class="big-number" id="generalAverage">--</div>
        <p class="total-grades" id="totalGrades">0 voti registrati</p>
    </div>

    <div class="panel">
        <div class="panel-title">✍️ Inserisci Nuovo Voto</div>
        
        <div class="form-group">
            <div class="select-wrapper">
                <select id="subjectSelect">
                    <option value="" disabled selected>Seleziona Materia...</option>
                    <option value="Inglese">Inglese</option>
                    <option value="Matematica">Matematica</option>
                    <option value="Storia">Storia</option>
                    <option value="Italiano">Italiano</option>
                    <option value="Informatica">Informatica</option>
                    <option value="TPS">TPS</option>
                    <option value="Telecomunicazioni">Telecomunicazioni</option>
                    <option value="Sistemi">Sistemi</option>
                    <option value="Motoria">Motoria</option>
                    <option value="Educazione Civica">Educazione Civica</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <input type="text" id="gradeInput" placeholder="Voto o voti separati da virgola (es. 7, 8+, 6.5)">
        </div>

        <div class="form-row">
            <div class="select-wrapper">
                <select id="weightSelect">
                    <option value="1">Peso: 100% (Pieno)</option>
                    <option value="0.5">Peso: 50% (Metà)</option>
                    <option value="0">Peso: 0% (Escluso)</option>
                </select>
            </div>
            
            <div class="checkbox-wrapper" id="labContainer" style="display: none;">
                <input type="checkbox" id="isLabInput">
                <label for="isLabInput">Laboratorio</label>
            </div>
        </div>

        <button class="btn-primary" onclick="window.verifyAndAdd()">➕ Aggiungi al Registro</button>
        <p class="hint">🔒 Protetto con password cifrata.</p>
    </div>

    <div class="panel">
        <div class="panel-title">📊 Situazione Materie</div>
        <div id="subjectsList">
            <div class="empty-box">Caricamento voti dal Cloud...</div>
        </div>
    </div>

    <div class="actions-footer">
        <button class="btn-warning" onclick="window.startNewYear()">🎓 Passa al Prossimo Anno Scolastico</button>
        <button class="btn-danger" onclick="window.verifyAndReset()">🗑️ Elimina Voti del Periodo Corrente</button>
    </div>

</div>

</body>
</html>
